<svg width="500" height="750" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="750" fill="url(#grad1)"/>
  
  <!-- Film reel icon -->
  <circle cx="250" cy="300" r="80" fill="none" stroke="#00d4ff" stroke-width="3"/>
  <circle cx="250" cy="300" r="60" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="250" cy="300" r="40" fill="#00d4ff" opacity="0.1"/>
  
  <!-- Play button -->
  <polygon points="220,280 220,320 280,300" fill="#00d4ff" opacity="0.8"/>
  
  <!-- Text -->
  <text x="250" y="420" font-family="Arial, sans-serif" font-size="24" fill="#00d4ff" text-anchor="middle" font-weight="bold">No Poster Available</text>
  <text x="250" y="460" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle">Imagen no disponible</text>
</svg>