version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dcicflix_db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  calification:
    build: ./calification
    ports:
      - "3003:3003"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/dcicflix_db
      RABBITMQ_URL: amqp://rabbitmq
    depends_on:
      - mongodb
      - rabbitmq

volumes:
  mongo_data: