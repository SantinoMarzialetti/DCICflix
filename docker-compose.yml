version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  calification:
    build: ./calification
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_EXCHANGE: events_exchange
      RABBITMQ_QUEUE_CLICKS: clicks_queue
      RABBITMQ_QUEUE_CALIFICATIONS: califications_queue
      RABBITMQ_QUEUE_PLAYS: plays_queue
    depends_on:
      rabbitmq:
        condition: service_healthy

  opiniones:
    build: ./opinions
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://mongodb:27017/dcicflix_db
      MONGODB_URI_ATLAS: mongodb+srv://admin321:admin123@moviesdb.hsjqo6c.mongodb.net/peliculas?retryWrites=true&w=majority&serverSelectionTimeoutMS=15000
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_EXCHANGE: events_exchange
      RABBITMQ_QUEUE_CLICKS: clicks_queue
      RABBITMQ_QUEUE_CALIFICATIONS: califications_queue
      RABBITMQ_QUEUE_PLAYS: plays_queue
    depends_on:
      rabbitmq:
        condition: service_healthy