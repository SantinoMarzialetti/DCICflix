services:
  server:
    build: ./
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_EXCHANGE: events_exchange
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
      api-movies:
        condition: service_healthy
    healthcheck:
      test: node -e "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"
      interval: 30s
      timeout: 10s
      retries: 5

  client:
    build: ./client
    ports:
      - "5173:8080"
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_RANDOM_API_URL: http://localhost:3001/api
      VITE_MOVIES_API_URL: http://localhost:3007/api/movies
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: node -e "require('http').get('http://localhost:8080', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  calification:
    build: ./calification
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_EXCHANGE: events_exchange
      RABBITMQ_QUEUE_CLICKS: clicks_queue
      RABBITMQ_QUEUE_CALIFICATIONS: califications_queue
      RABBITMQ_QUEUE_PLAYS: plays_queue
    depends_on:
      rabbitmq:
        condition: service_healthy

  opiniones:
    build: ./opinions
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://mongodb:27017/dcicflix_db
      MONGODB_URI_ATLAS: mongodb+srv://admin321:admin123@moviesdb.hsjqo6c.mongodb.net/peliculas?retryWrites=true&w=majority&serverSelectionTimeoutMS=15000
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_EXCHANGE: events_exchange
      RABBITMQ_QUEUE_CLICKS: clicks_queue
      RABBITMQ_QUEUE_CALIFICATIONS: califications_queue
      RABBITMQ_QUEUE_PLAYS: plays_queue
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-movies:
    build: ./api-movies
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      MONGODB_URI: mongodb+srv://admin321:admin123@moviesdb.hsjqo6c.mongodb.net/?appName=MoviesDB
      NODE_ENV: production
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3007/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  random-movie:
    build: ./random-movie
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      API_MOVIES_URL: http://api-movies:3007/api/movies
    depends_on:
      api-movies:
        condition: service_healthy
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3001/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5