services:
  server:
    build: ./
    container_name: server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_EXCHANGE: events_exchange
      NODE_ENV: production
      DATA_DIR: /app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      api-movies:
        condition: service_healthy
    volumes:
      - server_data:/app/data
    healthcheck:
      test: node -e "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  calification:
    build: ./calification
    container_name: calification
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_EXCHANGE: events_exchange
      RABBITMQ_QUEUE_CLICKS: clicks_queue
      RABBITMQ_QUEUE_CALIFICATIONS: califications_queue
      RABBITMQ_QUEUE_PLAYS: plays_queue
    depends_on:
      rabbitmq:
        condition: service_healthy

  opiniones:
    build: ./opinions
    container_name: opiniones
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://mongodb:27017/dcicflix_db
      MONGODB_URI_ATLAS: mongodb+srv://admin321:admin123@moviesdb.hsjqo6c.mongodb.net/peliculas?retryWrites=true&w=majority&serverSelectionTimeoutMS=15000
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_EXCHANGE: events_exchange
      RABBITMQ_QUEUE_CLICKS: clicks_queue
      RABBITMQ_QUEUE_CALIFICATIONS: califications_queue
      RABBITMQ_QUEUE_PLAYS: plays_queue
      CLICKS_DIR: /data/clicks
      PLAYS_DIR: /data/plays
      RATINGS_DIR: /data/ratings
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - clicks_data:/data/clicks
      - plays_data:/data/plays
      - ratings_data:/data/ratings

  api-movies:
    build: ./api-movies
    container_name: api-movies
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      MONGODB_URI: mongodb+srv://admin321:admin123@moviesdb.hsjqo6c.mongodb.net/?appName=MoviesDB
      NODE_ENV: production
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3007/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  random-movie:
    build: ./random-movie
    container_name: random-movie
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      API_MOVIES_URL: http://api-movies:3007/api/movies
    depends_on:
      api-movies:
        condition: service_healthy
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3001 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build: ./client
    container_name: client
    ports:
      - "5173:8080"
    environment:
      VITE_API_URL: http://server:3000/api
      VITE_RANDOM_API_URL: http://random-movie:3001/api
      VITE_MOVIES_API_URL: http://api-movies:3007/api/movies
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:8080 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  recommender:
    build: ./recommender
    container_name: recommender
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      CLICKS_DIR: /data/clicks
      PLAYS_DIR: /data/plays
      RATINGS_DIR: /data/ratings
      SERVER_DATA_DIR: /server/data
    depends_on:
      - opiniones
      - api-movies
    volumes:
      - clicks_data:/data/clicks
      - plays_data:/data/plays
      - ratings_data:/data/ratings
      - server_data:/server/data
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3005/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  server_data:
  clicks_data:
  plays_data:
  ratings_data: